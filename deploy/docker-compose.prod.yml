# Full stack on one server: Caddy (HTTPS) -> frontend + backend.
# Run from this directory:  docker compose -f docker-compose.prod.yml up -d --build
# Reads SITE_HOST from ./.env (written by setup-server.sh).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_HOST=${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ../backend
      target: staging
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - LEXUME_DB_PATH=/data/lexume.db
    volumes:
      - lexume-data:/data

  frontend:
    build:
      context: ../frontend
      target: staging
      args:
        # Empty = same origin (/api/... via Caddy).
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"

volumes:
  lexume-data:
  caddy-data:
  caddy-config:
