# Backend only. Run from this directory on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ../backend
      target: staging
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LEXUME_DB_PATH=/data/lexume.db
    volumes:
      - lexume-data:/data

volumes:
  lexume-data:
